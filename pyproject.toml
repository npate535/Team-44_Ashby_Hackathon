[project]
name = "pathqueue"
version = "0.1.0"
description = "Sepia: AI-prioritized breast-pathology worklist with explainable, confidence-aware case reads (research prototype, Team 44, 2026 Ashby Prize hackathon). Not for clinical use."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "numpy>=2.1",
    "openai>=1.50",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pillow>=11.0",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.2",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "torch>=2.6",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "playwright>=1.48",
    "pytest>=8.3",
]

# Editable install: hatchling writes a .pth that puts the repo root on sys.path, so `import core`,
# `import pipeline` (and the agent/backend/eval packages later tasks add) work from any working directory
# under `uv run`. Delta-side code does not use this environment (see core/__init__.py).
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "pipeline"]

# torch: macOS arm64 resolves the default PyPI wheel (CPU + MPS). Every other platform resolves the
# CPU-only wheel from the PyTorch index, so no CUDA packages enter the lock. GPU work happens on Delta.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
# Only our tests: resources/official/ ships its own test_*.py that need CONCH/MUSK installs.
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
