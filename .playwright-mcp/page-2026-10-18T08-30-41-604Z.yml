              - paragraph [ref=f6e4572]: What these results do not show, where they come from, and whom to credit.
            - generic [ref=f6e4573]:
              - figure [ref=f6e4574]:
                - heading "Limitations" [level=3] [ref=f6e4576]
                - list [ref=f6e4577]:
                  - listitem [ref=f6e4578]: Research prototype on a small public dataset (BACH, CC BY-NC-ND 4.0); not a clinical device and not for clinical use.
                  - listitem [ref=f6e4579]: BACH labels are diagnostic categories, not Nottingham grades; "likely aggressive" means "likely invasive carcinoma".
                  - listitem [ref=f6e4580]: "Small test set (THUNDER split, 132 images) with partial patient IDs: pseudo-patient groups and wide intervals."
                  - listitem [ref=f6e4581]: "The surgical lane is simulated: image borders stand in for inked margins and frozen-section artifacts are simulated degradations; composite fields are synthetic constructions from test images."
                  - listitem [ref=f6e4582]: Concept scores are features associated with the classes, not causes and not validated grade components; caption consistency measures caption co-mention, not tissue truth.
                  - listitem [ref=f6e4583]: Conformal coverage assumes exchangeable data; it is not a per-case guarantee and does not carry over to degraded or composite inputs.
                  - listitem [ref=f6e4584]: Follow-up order rules are illustrative and require clinical review; the agent only drafts orders. Spot checks say whether a human or an AI reviewed them.
                  - listitem [ref=f6e4585]: The queue simulation is a model with stated assumptions, not a measured workflow outcome.
