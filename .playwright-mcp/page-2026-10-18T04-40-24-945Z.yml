          - generic [ref=e1541]:
            - heading "Limitations" [level=2] [ref=e1542]
            - list [ref=e1543]:
              - listitem [ref=e1544]: "The surgical lane is simulated: image borders stand in for inked margins and frozen-section artifacts are synthetic degradations. No frozen-section data was available."
              - listitem [ref=e1545]: BACH is small (400 microscopy images; test split 132, with few identified patients), so intervals are wide. Conformal coverage requires exchangeability; compare the observed held-out coverage above with the nominal target. The target is not a per-case guarantee.
              - listitem [ref=e1546]: BACH labels are diagnostic categories, not Nottingham grades; concepts are features associated with invasive carcinoma, not causes.
              - listitem [ref=e1547]: Follow-up order rules are illustrative and require clinical review. Spot-checks may be AI-reviewed; each result says which.
              - listitem [ref=e1548]: Research prototype — not for clinical use.
