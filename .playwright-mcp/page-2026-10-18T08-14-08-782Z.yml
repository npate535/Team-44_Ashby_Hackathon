              - paragraph [ref=f4e5957]: What these results do not show, where they come from, and whom to credit.
            - generic [ref=f4e5958]:
              - figure [ref=f4e5959]:
                - heading "Limitations" [level=3] [ref=f4e5961]
                - list [ref=f4e5962]:
                  - listitem [ref=f4e5963]: Research prototype on a small public dataset (BACH, CC BY-NC-ND 4.0); not a clinical device and not for clinical use.
                  - listitem [ref=f4e5964]: BACH labels are diagnostic categories, not Nottingham grades; "likely aggressive" means "likely invasive carcinoma".
                  - listitem [ref=f4e5965]: "Small test set (THUNDER split, 132 images) with partial patient IDs: pseudo-patient groups and wide intervals."
                  - listitem [ref=f4e5966]: "The surgical lane is simulated: image borders stand in for inked margins and frozen-section artifacts are simulated degradations; composite fields are synthetic constructions from test images."
                  - listitem [ref=f4e5967]: Concept scores are features associated with the classes, not causes and not validated grade components; caption consistency measures caption co-mention, not tissue truth.
                  - listitem [ref=f4e5968]: Conformal coverage assumes exchangeable data; it is not a per-case guarantee and does not carry over to degraded or composite inputs.
                  - listitem [ref=f4e5969]: Follow-up order rules are illustrative and require clinical review; the agent only drafts orders. Spot checks say whether a human or an AI reviewed them.
                  - listitem [ref=f4e5970]: The queue simulation is a model with stated assumptions, not a measured workflow outcome.
