              - figure [ref=e2827]:
                - heading "Limitations" [level=3] [ref=e2829]
                - list [ref=e2830]:
                  - listitem [ref=e2831]: Research prototype on a small public dataset (BACH, CC BY-NC-ND 4.0); not a clinical device and not for clinical use.
                  - listitem [ref=e2832]: BACH labels are diagnostic categories, not Nottingham grades; "likely aggressive" means "likely invasive carcinoma".
                  - listitem [ref=e2833]: "Small test set (THUNDER split, 132 images) with partial patient IDs: pseudo-patient groups and wide intervals."
                  - listitem [ref=e2834]: "The surgical lane is simulated: image borders stand in for inked margins and frozen-section artifacts are simulated degradations; composite fields are synthetic constructions from test images."
                  - listitem [ref=e2835]: Concept scores are features associated with the classes, not causes and not validated grade components; caption consistency measures caption co-mention, not tissue truth.
                  - listitem [ref=e2836]: Conformal coverage assumes exchangeable data; it is not a per-case guarantee and does not carry over to degraded or composite inputs.
                  - listitem [ref=e2837]: Follow-up order rules are illustrative and require clinical review; the agent only drafts orders. Spot checks say whether a human or an AI reviewed them.
                  - listitem [ref=e2838]: The queue simulation is a model with stated assumptions, not a measured workflow outcome.
