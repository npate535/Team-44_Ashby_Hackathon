name: Deploy Sepia to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sepia-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify web runtime and workflows
        run: |
          python -m pip install -r deploy/requirements.txt pytest
          python -m pytest -q tests/test_api.py tests/test_db.py tests/test_simulator.py tests/test_frontend_static.py tests/test_vercel_workspace.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package the web runtime and CDN assets
        run: python scripts/package_vercel.py --out "$RUNNER_TEMP/sepia-vercel"
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_GZps67dz8x1dCceATnjDa4N2
          VERCEL_PROJECT_ID: prj_gaowlJz3pex6gL1SHflNxlRf026R
        run: |
          npm install --global vercel@59.23.2
          cd "$RUNNER_TEMP/sepia-vercel"
          vercel deploy --prod --yes --token "$VERCEL_TOKEN"
          curl --fail --max-time 60 --retry 5 --retry-all-errors --retry-delay 3 https://sepia-ashby.vercel.app/api/health
