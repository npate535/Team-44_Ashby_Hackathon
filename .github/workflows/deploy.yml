name: Deploy Sepia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sepia-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify web runtime and workflows
        run: |
          python -m pip install -r deploy/requirements.txt pytest
          python -m pytest -q tests/test_api.py tests/test_db.py tests/test_simulator.py tests/test_frontend_static.py
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Deploy code with the persistent case volume
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --remote-only --depot=false --ha=false --build-arg "RELEASE_SHA=$GITHUB_SHA"
          curl --fail --max-time 30 --retry 5 --retry-all-errors --retry-delay 3 https://sepia-ashby.fly.dev/api/health
